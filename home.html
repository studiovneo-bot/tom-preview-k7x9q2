<title>tOM — hannam</title>
<style>
/* ───────────────────────────────────────────────
   tOM 홈 — 본선 (2026-08-18 Neo 확정: "최종을 toteme 판으로 가고
   기존에 만든 랜딩 페이지는 유지")
   구 홈(가운데 세리프 캡션 + 45px 거터)은 home-v4-center.html 로 남겨둠
   Totême(toteme.com/ko-kr) 문법을 실측해 옮겼다:
   · 사진이 화면을 통째로 채운다 — 여백 0, 사진 사이 간격 0. 한 칸 = 50vw × 100vh
   · 헤더는 fixed · 배경 완전 투명. 사진 위에 그냥 얹힌다. 경계선도 띠도 없다
   · 캡션은 사진 안 하단 중앙 두 줄. 크기 차이만으로 위계를 만든다

   tOM에 옮기며 바꾼 것:
   · 서체 — Totême는 산세리프 라이트지만 tOM 정본 Times 세리프로 (Neo 지시)
   · 캡션 높이 — Totême 실측 130px는 tOM 사진에서 인물 위에 얹혀 28px로 내림
   · 헤더 글자색 — Totême는 잉크 하나로 끝나지만(전 사진이 하이키)
     tOM 사진은 밝기가 제각각이라 스크롤에 따라 자동으로 뒤집는다
   · 마감 블록(레드룰·매장·뉴스레터·검정 푸터)은 구 홈에서 그대로 살렸다
   · Selected Brands 타이포 블록은 뺐다 — 커버(index.html)가 곧 브랜드 목록이다

   ?band 를 붙이면 헤더 뒤에 배경 띠를 깐 비교판. 2026-08-18 Neo가 투명판으로 확정,
   띠판은 되살릴 일에 대비해 코드만 남겨둔 것이다
   ─────────────────────────────────────────────── */

:root{
  --bg:#f5f4f1;
  --ink:#111;
  --nav-font:"acumin-pro","Acumin Pro","Helvetica Neue","Inter",-apple-system,Arial,sans-serif;
  --display-font:"Times New Roman",Times,"Noto Serif",serif;  /* tOM 정본 디스플레이 서체 */
  --red:#a5202a;       /* Bazaar 레드. 페이지 전체에서 한 번만 */
  --body:#6d6d6d;
  --soft:#9a9a9a;
  --line:#dcdcdc;
  --t-meta:13px;
  --t-micro:11px;
  --serif-kr:AppleMyungjo,"Nanum Myeongjo",serif;
  --pad:45px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--nav-font);
  font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
img{display:block;width:100%;height:auto}
a{color:inherit;text-decoration:none}

/* ── 헤더 — Totême: 투명 · 사진 위 · 스크롤을 따라온다 ──
   2026-08-18 Neo "스크롤 내릴 때 로고랑 메뉴가 같이 내려오는 인터랙션은 어떠니"

   Totême 원본도 `position:fixed`다. 그런데 그쪽은 전 사진이 하이키라
   잉크 헤더 하나로 끝난다. tOM 사진은 밝기가 제각각이라 그대로 따라오게 하면
   밝은 칸에서 흰 글자가, 어두운 칸에서 검은 글자가 통째로 사라진다
   (오늘 QA에서 실제로 잡힌 결함이라 한 번 `absolute`로 후퇴했었다).

   그래서 따라오게 하되 **글자색이 뒤 사진 밝기에 따라 스스로 뒤집히게** 했다.
   스크림·그림자를 덧대지 않는 대신, 각 사진을 캔버스로 미리 훑어
   세로 45px × 가로 1/24 격자의 평균 휘도표를 만들어 두고
   스크롤할 때마다 메뉴·로고·유틸 세 구역이 지금 어떤 밝기 위에 있는지 조회한다.
   판정 기준 70 — 그보다 밝으면 잉크, 어두우면 흰색 (근거는 스크립트 주석) */
.head{
  position:fixed;top:0;left:0;right:0;z-index:10;
  background:transparent;
  height:90px;padding:0 var(--pad);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;
  /* 고정 헤더가 상단 90px 띠 전체의 클릭을 먹어 밑의 사진 링크가 안 눌렸다(QA 4차).
     글자에만 클릭을 허용하고 빈 공간은 통과시킨다 */
  pointer-events:none;
}
.head a{pointer-events:auto}
/* 기본은 잉크. 스크립트가 **링크 하나하나**에 .z-paper를 붙였다 뗀다.
   메뉴 5개를 한 덩어리로 재면 왼쪽이 밝을 때 오른쪽 링크가 어두운 배경에
   묻혀도 잉크로 남는다 — QA에서 잡힌 결함(휘도 31~39 위에 잉크) */
.head, .head a{color:#090909}
.head a{transition:color .22s ease}
.head a.z-paper{color:#f2f1ee}
.mark{line-height:1;grid-column:2}
.mark img{height:24px;width:auto;display:block;transition:filter .22s ease}
.mark.z-paper img{filter:invert(1) brightness(2.2)}
.head nav{
  grid-column:1;grid-row:1;
  display:flex;align-items:center;gap:35px;flex-wrap:wrap;
  font-size:13px;letter-spacing:.3px;
}
.head .util{grid-column:3;grid-row:1;justify-self:end;display:flex;gap:35px}
.acct{font-size:13px;letter-spacing:.3px}

/* ── Totême 격자 — 50vw × 100vh, 간격 0 ── */
.grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:0;                       /* Totême 실측: 사진끼리 붙는다 */
}
.cell{position:relative;height:100vh;overflow:hidden;display:block}
.cell img{width:100%;height:100%;object-fit:cover}
/* tOM 정본: 에디토리얼 페이지는 흑백(상품 페이지만 예외) — 본선 home.html과 동일 */
.cell img{filter:grayscale(1) contrast(1.06)}
.cell figcaption{
  position:absolute;left:0;right:0;bottom:0;
  /* Totême 실측은 바닥에서 130px(padding-bottom 96px)이지만 tOM 사진에서는
     그 높이가 정확히 인물·사물 위에 얹힌다. 12px 간격으로 세로 위치를 훑어
     네 칸의 글자 자리 휘도가 가장 갈리는 28px로 내렸다.
     (그 자리에서 arrivals 242 / store 30 — 잉크·흰색이 확실히 갈린다) */
  padding-bottom:28px;
  text-align:center;pointer-events:none;
}
/* 2026-08-18 Neo "폰트를 세리프로 해보자" — Totême는 산세리프 라이트지만
   tOM 정본 디스플레이 서체는 Times다. 세리프는 같은 px에서 작아 보이므로
   18→22px, 12→13px로 올리고 굵기 300(세리프에 없는 굵기)을 400으로 되돌린다 */
.cell .t{
  display:block;font-family:var(--display-font);
  font-size:22px;font-weight:400;line-height:1.24;
  letter-spacing:0;
}
.cell .s{
  display:block;font-family:var(--display-font);
  font-size:13px;font-weight:400;line-height:1.6;
  text-transform:capitalize;margin-top:8px;
}
/* 칸마다 '글자가 실제로 놓이는 자리'의 휘도를 캔버스로 재서 고른 색.
   칸 전체 폭이 아니라 Range로 글자 범위만 재야 한다 — 처음에 전체 폭을 재서
   arrivals 칸 색을 반대로 골랐었다.
   실측(padding-bottom 28px 기준): arrivals 192·246 / paper 125·181 /
   exclusive 114·110 / store 40·32
   → 앞 세 칸 잉크, 매장 칸만 흰색.
   Totême는 네 칸 전부 잉크 하나로 끝난다. 사진이 전부 하이키라서 가능한 일이다 */
.cell--ink figcaption{color:#090909}
.cell--paper figcaption{color:#f2f1ee}

/* 사진이 화면을 채우므로 링크 전체가 눌린다 */
.cell::after{content:"";position:absolute;inset:0}
.cell img{transition:opacity .25s}
.cell:hover img{opacity:.9}

/* ── 띠 버전 (주소 뒤 ?band) ────────────────────
   2026-08-18 Neo "헤더 뒤에 배경 띠 깐 버전도 만들어서 비교해줘"

   투명 헤더의 유일한 약점은 칸의 하단 캡션이 화면 맨 위에 닿을 때 스치는 것이다.
   띠를 깔면 그 문제가 사라지고 자동 대비 장치도 필요 없어진다.
   대신 사진이 화면 끝까지 가지 않게 되어 Totême 문법의 핵심(여백 0)이 하나 깨진다.

   띠 색은 tOM 정본 배경 #f5f4f1. 검은 띠도 가능하나 그러면 사이트가 무거워진다.
   띠 높이만큼 사진을 밀어 내려 헤더가 사진을 가리지 않게 한다 — 가리면 띠를 깐 의미가 없다 */
body.band .head{
  background:var(--bg);
  border-bottom:1px solid rgba(17,17,17,.10);   /* 종이색끼리 만나므로 경계 한 줄 */
}
body.band .head a{color:var(--ink)}
body.band .mark img{filter:none}
body.band .grid{padding-top:var(--headh,90px)}
body.band .cell{height:calc(100vh - var(--headh, 90px))}
@media (max-width:900px){
  body.band .head--tight nav{display:flex}   /* 띠가 있으면 메뉴를 접을 이유가 없다 */
}

/* ── 아래는 기존 홈(home-v4-center.html)에서 그대로 옮겨온 마감 블록 ──
   2026-08-18 Neo "최종을 toteme 판으로 가고 기존에 만든 랜딩 페이지는 유지".
   격자만 Totême 문법으로 갈아끼우고 매장·뉴스레터·레드룰·검정 푸터는 살린다.
   Selected Brands 타이포 블록은 뺐다 — 커버(index.html)가 곧 브랜드 목록이라
   같은 것을 두 번 보여줄 이유가 없다는 Neo 판단 */

/* ── 조용한 마감선 — 페이지를 가로지르는 한 번의 레드 ── */
.said{padding:52px var(--pad) 0}
.said .rule{width:100%;height:3px;background:var(--red);margin-bottom:14px}
.said .meta{display:block;font-size:10px;letter-spacing:.4px;color:var(--soft)}

/* ── 매장 · 뉴스레터 ───────────────────── */
.foot-info{
  display:grid;grid-template-columns:1fr 1fr;gap:40px;
  padding:82px var(--pad) 0;
}
.foot-info h3{
  font-size:var(--t-micro);letter-spacing:.3px;
  color:var(--soft);font-weight:400;margin-bottom:12px;
}
.foot-info p{color:var(--ink)}
.foot-info .sub{color:var(--body);font-size:var(--t-meta);margin-top:2px}
.foot-info > div:last-child{justify-self:end;width:100%;max-width:420px}

form{display:flex;margin-top:14px;max-width:420px}
input[type=email]{
  flex:1;min-width:0;
  border:1px solid var(--line);border-right:0;border-radius:0;
  background:transparent;padding:12px 13px;
  font:inherit;font-size:var(--t-meta);color:var(--ink);
}
input[type=email]::placeholder{color:var(--soft)}
input[type=email]:focus{outline:0;border-color:var(--ink)}
button{
  border:0;border-radius:0;cursor:pointer;
  background:var(--ink);color:#fff;padding:12px 22px;
  font-family:var(--nav-font);font-weight:300;font-size:var(--t-meta);
}

@media (max-width:900px){
  .foot-info{grid-template-columns:1fr;gap:30px;padding-top:60px}
  .foot-info > div:last-child{justify-self:start}
}

/* ── 푸터 ── */
footer{
  margin-top:88px;background:var(--ink);color:#8f8f8f;
  padding:24px var(--pad);text-align:center;font-size:var(--t-micro);
}
footer nav{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
footer a{color:#8f8f8f}
footer a:hover{color:#fff}

/* ── 모바일 — Totême는 한 칸씩 세로로 쌓는다 ──
   헤더 반응형은 본선 home.html의 확정 규칙(2026-08-16 Róhe 모바일 문법 +
   중간 폭 3열 복원)을 그대로 옮겨온다. 샘플이 이걸 빠뜨려 390에서 헤더가 겹쳤었다 */
@media (max-width:900px){
  :root{--pad:16px}
  .grid{grid-template-columns:1fr}
  .cell{height:88vh}
  .cell figcaption{padding-bottom:64px}
  .head{height:auto;grid-template-columns:1fr auto;align-items:center;justify-items:start;gap:12px 16px;padding:18px var(--pad) 14px}
  .mark{grid-column:1;grid-row:1}
  .head nav{grid-column:1 / -1;grid-row:2;justify-content:flex-start;row-gap:8px;column-gap:18px}
  .head .util{grid-column:2;grid-row:1;justify-self:end;gap:16px}
  /* 모바일 헤더는 두 줄(로고·유틸 / 메뉴)이라 그대로 따라오면 칸 캡션과 겹친다.
     스크롤이 시작되면 메뉴 줄만 접고 로고·유틸 한 줄로 따라온다 */
  .head nav{transition:opacity .2s ease}
  .head--tight nav{display:none}
}
/* 중간 폭(반쪽 창 681~900px)은 데스크톱 헤더 유지 */
@media (min-width:681px) and (max-width:900px){
  .head{height:90px;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:stretch;gap:28px;padding:0 var(--pad)}
  .mark{grid-column:2;grid-row:1}
  .head nav{grid-column:1;grid-row:1;justify-content:flex-start;column-gap:28px}
  .head .util{grid-column:3;grid-row:1;justify-self:end}
}
@media (max-width:680px){
  .head nav a,.acct{padding:12px 2px}   /* 터치 영역 44px */
}
</style>

<script>
/* 헤더 자동 대비 — 2026-08-18
   사진마다 밝기가 달라 고정 헤더가 묻힌다. 스크림을 덧대는 대신
   각 칸의 사진을 미리 캔버스로 훑어 휘도표를 만들고, 스크롤할 때
   메뉴·로고·유틸 세 구역이 지금 놓인 자리의 밝기를 조회해 색을 뒤집는다. */
(function(){
  /* 주소 뒤 ?band 면 띠 버전. 두 판을 같은 파일에서 비교한다 */
  var BANDMODE=/[?&]band\b/.test(location.search);
  if(BANDMODE) document.body.classList.add('band');

  /* 판정 기준값. 처음에 138(중간값)으로 뒀다가 QA 실측에서 대비 1.3까지 떨어졌다.
     잉크(#090909)와 흰색(#f2f1ee)의 대비가 같아지는 지점을 풀면
       (L+12.5)/(9+12.5) = (242+12.5)/(L+12.5)  →  L ≈ 62
     잉크가 흰색보다 훨씬 극단적인 색이라 경계는 중간이 아니라 훨씬 아래다.
     여유를 조금 둬 70. 이보다 어두우면 흰색, 밝으면 잉크 */
  var COLS=24, BAND=45, THRESHOLD=70;
  var cells=[].slice.call(document.querySelectorAll('.cell'));
  var head=document.querySelector('.head');
  /* 판정 단위 = **글자 하나하나**.
     ① 화면 비율(우측 30%)로 잡았더니 밝은 벽돌과 어두운 모서리가 섞여
        평균이 밝게 나왔고 오른쪽 끝 Log In이 사라졌다
     ② 그래서 요소 사각형으로 바꿨는데, 메뉴 5개가 한 요소라 같은 문제가 남았다
        (왼쪽 Brands가 밝으면 오른쪽 Store가 어두운 자리에서도 잉크로 남는다)
     ③ 최종: 링크 단위로 각자 자기 자리만 잰다. 로고는 .mark 자체를 잰다 */
  var zones=[].concat(
    [].slice.call(document.querySelectorAll('.head nav a, .head .util a')),
    [document.querySelector('.mark')]
  ).filter(Boolean);
  var maps=[], ready=false;

  function buildOne(cell){
    var img=cell.querySelector('img');
    var r=cell.getBoundingClientRect();
    var w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    var x=cv.getContext('2d',{willReadFrequently:true});
    if(!img.naturalWidth) return null;
    var s=Math.max(w/img.naturalWidth,h/img.naturalHeight);
    var dw=img.naturalWidth*s, dh=img.naturalHeight*s;
    /* 화면에 실제로 걸리는 필터를 캔버스에도 똑같이 건다.
       이걸 빠뜨리면 원본 컬러를 읽어 휘도표가 렌더 결과와 어긋난다 (QA 4차 결함) */
    x.filter = getComputedStyle(img).filter || 'none';
    x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    x.filter='none';
    var rows=Math.ceil(h/BAND), grid=new Float32Array(rows*COLS);
    for(var ry=0; ry<rows; ry++){
      var y0=ry*BAND, bh=Math.min(BAND,h-y0);
      for(var cx=0; cx<COLS; cx++){
        var x0=Math.floor(cx*w/COLS), bw=Math.max(1,Math.floor((cx+1)*w/COLS)-x0);
        var d=x.getImageData(x0,y0,bw,bh).data, sum=0,n=0;
        for(var i=0;i<d.length;i+=4){ sum+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; n++; }
        grid[ry*COLS+cx]=sum/n;
      }
    }
    return {grid:grid, rows:rows, cols:COLS, w:w, h:h,
            top:r.top+window.pageYOffset, left:r.left+window.pageXOffset};
  }

  function build(){
    headh();
    if(BANDMODE) return;         /* 띠 버전은 휘도표를 만들 필요가 없다 */
    maps=cells.map(buildOne);
    ready=maps.every(function(m){return !!m;});
    apply();
  }

  /* 화면좌표 [x0,x1] × [y0,y1] 구간의 평균 휘도. 사진이 없는 자리는 배경(#f5f4f1≈244) */
  function lum(x0,x1,y0,y1){
    var sy0=y0+window.pageYOffset, sy1=y1+window.pageYOffset;
    var sum=0, area=0;
    for(var k=0;k<maps.length;k++){
      var m=maps[k]; if(!m) continue;
      var oy0=Math.max(sy0,m.top), oy1=Math.min(sy1,m.top+m.h);
      var ox0=Math.max(x0,m.left), ox1=Math.min(x1,m.left+m.w);
      if(oy1<=oy0||ox1<=ox0) continue;
      var r0=Math.floor((oy0-m.top)/BAND), r1=Math.min(m.rows-1,Math.floor((oy1-1-m.top)/BAND));
      var c0=Math.floor((ox0-m.left)/m.w*m.cols), c1=Math.min(m.cols-1,Math.floor((ox1-1-m.left)/m.w*m.cols));
      for(var ry=r0;ry<=r1;ry++) for(var cx=c0;cx<=c1;cx++){ sum+=m.grid[ry*m.cols+cx]; area++; }
    }
    if(!area) return 244;                       /* 사진 밖 = 종이 배경 */
    return sum/area;
  }

  function headh(){
    document.documentElement.style.setProperty('--headh',
      Math.round(head.getBoundingClientRect().height)+'px');
  }

  function apply(){
    if(BANDMODE) return;   /* 띠가 깔리면 글자색을 뒤집을 이유가 없다 */
    if(!ready) return;
    zones.forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.width<=0||r.height<=0) return;
      var PAD=6;   /* 글자 주변 여유 — 획 사이로 배경이 비쳐 보이는 폭 */
      var L=lum(r.left-PAD, r.right+PAD, Math.max(0,r.top-PAD), r.bottom+PAD);
      el.classList.toggle('z-paper', L<THRESHOLD);
    });
  }

  function tighten(){
    if(BANDMODE) return;
    var narrow=window.matchMedia('(max-width:900px)').matches;
    head.classList.toggle('head--tight', narrow && window.pageYOffset>40);
  }

  var tick=false;
  function onScroll(){ if(tick) return; tick=true;
    requestAnimationFrame(function(){ tick=false; tighten(); apply(); }); }

  function boot(){
    var imgs=cells.map(function(c){return c.querySelector('img');});
    Promise.all(imgs.map(function(i){
      return i.complete ? Promise.resolve() : new Promise(function(r){ i.onload=i.onerror=r; });
    })).then(build);
  }
  if(document.readyState==='complete') boot(); else window.addEventListener('load',boot);
  headh(); tighten();
  window.addEventListener('scroll',onScroll,{passive:true});
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(build,180); });
})();
</script>

</body>
</html>
