<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script>(function(){try{if(sessionStorage.getItem('tomkey')!=='ok')location.replace('gate.html');}catch(e){location.replace('gate.html');}})();</script>

<title>tOM — hannam</title>
<style>
/* ───────────────────────────────────────────────
   tOM 커버 — 확정 (2026-08-18 Neo "이 배열이 더 낫다, 균형감만 더")
   지그재그 계단 배열 + 접지선. 좌측 스택 판은 폐기.

   균형 규칙:
   · 일곱 단이 같은 간격(12.6vh)으로 내려간다
   · 좌우 들여쓰기는 8vw 하나 — 좌→우→좌→중앙→우→좌→우
   · 가운데 줄(Giovanni)만 정중앙에서 접지선을 가로지른다
   · 로고(상단 중앙)와 Enter(하단 중앙)가 수직축을 이룬다
   · 붉은 괘선 하나만 왼쪽 모서리를 뚫는다
   어디를 눌러도 입장 → home.html
   ─────────────────────────────────────────────── */
:root{
  --bg:#f5f4f1;
  --ink:#111;
  --soft:#9a9a9a;
  --line:#dcdcdc;
  --red:#a5202a;
  --nav-font:"acumin-pro","Acumin Pro","Helvetica Neue","Inter",-apple-system,Arial,sans-serif;
  --display-font:"Times New Roman",Times,"Noto Serif",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--nav-font);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

.cover{position:relative;display:block;height:100%;cursor:pointer}

/* 접지선 — 화면은 펼침면이다 */
.fold{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}

.mark{position:absolute;top:26px;left:50%;transform:translateX(-50%);z-index:3}
.mark img{height:28px;width:auto;display:block}

/* 이름들 — 같은 크기, 같은 간격, 8vw 들여쓰기 교차 */
.n{
  position:absolute;z-index:1;
  font-family:var(--display-font);font-weight:400;
  font-size:min(10.2vw,14.5vh);
  line-height:.85;letter-spacing:-.03em;white-space:nowrap;
  color:var(--ink);
  transition:color .15s ease;
}
.n:hover{color:#b3b3b3}

.n1{top:9vh;    left:8vw}                                  /* Tom Atelier */
.n2{top:21.6vh; right:8vw}                                 /* Biek Verstappen */
.n4{top:34.2vh; left:8vw}                                  /* Nostrasantissima */
.n3{top:46.8vh; left:50%;transform:translateX(-50%)}       /* Giovanni Cavagna — 정중앙 */
.n6{top:59.4vh; right:8vw}                                 /* Uma Wang */
.n7{top:72vh;   left:8vw}                                  /* tagliovivo */
.n5{top:84.6vh; right:8vw}                                 /* Ziggy Chen */

/* 빨강 하나 — 왼쪽 모서리를 뚫고 들어오는 괘선 */
.redrule{position:absolute;top:91vh;left:-2vw;width:12vw;height:2px;background:var(--red);z-index:1}

.enter{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font-family:var(--display-font);font-size:15px;letter-spacing:.2px;color:var(--soft);z-index:3;
  background:var(--bg);padding:6px 14px;
}
.cover:hover .enter{color:var(--ink)}

/* 모바일 — 같은 문법, 세로 지면. 로고는 메인 페이지처럼 좌측 */
@media (max-width:680px){
  .mark{left:16px;transform:none}
  .n{font-size:5.6vh}
  .n1{top:10vh;   left:6vw}
  .n2{top:21.5vh; left:auto;right:6vw}
  .n4{top:33vh;   left:6vw}
  .n3{top:44.5vh; left:50%;transform:translateX(-50%)}
  .n6{top:56vh;   right:6vw}
  .n7{top:67.5vh; left:6vw}
  .n5{top:79vh;   right:6vw;left:auto}
  .redrule{top:88vh;left:-4vw;width:26vw}
}

@media (prefers-reduced-motion:reduce){
  .n{transition:none}
}
</style>
</head>
<body>

<a class="cover" href="home.html" aria-label="tOM 입장">
  <span class="fold" aria-hidden="true"></span>
  <span class="mark"><img src="img/tom-logo.svg" alt="tOM"></span>
  <span class="n n1" aria-hidden="true">Tom Atelier</span>
  <span class="n n2" aria-hidden="true">Biek Verstappen</span>
  <span class="n n4" aria-hidden="true">Nostrasantissima</span>
  <span class="n n3" aria-hidden="true">Giovanni Cavagna</span>
  <span class="n n6" aria-hidden="true">Uma Wang</span>
  <span class="n n7" aria-hidden="true">tagliovivo</span>
  <span class="n n5" aria-hidden="true">Ziggy Chen</span>
  <span class="redrule" aria-hidden="true"></span>
  <span class="enter">Enter</span>
</a>

</body>
</html>
