<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<script>(function(){try{if(sessionStorage.getItem('tomkey')!=='ok')location.replace('gate.html');}catch(e){location.replace('gate.html');}})();</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tOM — Store</title>
<link rel="stylesheet" href="site.css">
<style>
.st{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:60px 20px 80px}
.st h1{font-size:clamp(56px,10vw,160px);font-weight:400;line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
.st dl{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;align-content:start}
.st dt{color:var(--soft)}
@media (max-width:760px){.st{grid-template-columns:1fr}}
</style>
</head>
<body data-page="store.html">

<section class="full"><video autoplay muted loop playsinline poster="ai/vs.jpg"><source src="ai/vs.mp4" type="video/mp4"></video></section>

<section class="st">
  <h1>Come<br>by.</h1>
  <dl>
    <dt>Store</dt><dd>tOM — Hannam-dong, Seoul</dd>
    <dt>Address</dt><dd>확인 전</dd>
    <dt>Hours</dt><dd>확인 전</dd>
    <dt>Since</dt><dd>1997</dd>
    <dt>Enquire</dt><dd>확인 전 (카카오 채널 · 전화)</dd>
    <dt>Visit</dt><dd>New arrivals are sold in store. Ask us before you come — we will set them aside.</dd>
  </dl>
</section>

<section class="two">
  <div class="cell"><video autoplay muted loop playsinline poster="ai/poster02.jpg"><source src="ai/v02.mp4" type="video/mp4"></video></div>
  <div class="cell"><img src="ai/f06.jpg" alt="" loading="lazy"></div>
</section>

<script src="site.js"></script>
</body>
</html>
