<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<script>(function(){try{if(sessionStorage.getItem('tomkey')!=='ok')location.replace('gate.html');}catch(e){location.replace('gate.html');}})();</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tOM — Brands</title>
<link rel="stylesheet" href="site.css">
<style>
/* 영상 위에 이름만. 움직임 하나 = 이름에 올리면 그 집의 장면으로 바뀐다 */
.bw{position:relative;height:calc(100vh - var(--hh));overflow:hidden;background:#111}
.bw video,.bw .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bw .bg{opacity:0;transition:opacity .6s}
.bw .bg.on{opacity:1}
.bw .names{position:absolute;inset:0;z-index:5;padding:30px 20px;columns:3;column-gap:20px;color:#fff;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;line-height:2.1}
.bw .names a{display:block;break-inside:avoid;opacity:.85}
.bw .names a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.bw .names .k{color:rgba(255,255,255,.55);margin-bottom:10px}
@media (max-width:760px){.bw .names{columns:2}}
</style>
</head>
<body data-page="brands.html">

<section class="bw">
  <video autoplay muted loop playsinline poster="ai/vb.jpg"><source src="ai/vb.mp4" type="video/mp4"></video>
  <img class="bg" data-b="0" src="ai/m12.jpg" alt=""><img class="bg" data-b="1" src="ai/m13.jpg" alt=""><img class="bg" data-b="2" src="ai/m14.jpg" alt=""><img class="bg" data-b="3" src="ai/m11.jpg" alt="">
  <div class="names" id="names"><div class="k">Houses — 28</div></div>
</section>

<script src="site.js"></script>
<script>
var B=["Aleksandr Manamïs","Andrew Driftwood","Another-Archive","Babara Alan","Begfabel","Biek Verstappen","By Waild","Chiahung Su","Claudio Cutuli","Daniele Basta","Doys","Fabio Quaranta","Giovanni Cavagna","Guidi","Horisaki","Individual Sentiments","Isaac Sellam","Isabel Benenato","Leon Louis","Marc Point","Masnada","Mavranyma","Nostrasantissima","tagliovivo","Uma Wang","Un-Namable","Yeung Chin","Ziggy Chen"];
var box=document.getElementById('names'),bgs=document.querySelectorAll('.bw .bg');
B.forEach(function(n,i){var a=document.createElement('a');a.href='exclusive.html';a.textContent=n;
 a.onmouseenter=function(){bgs.forEach(function(b){b.classList.toggle('on',+b.dataset.b===i%4)})};
 a.onmouseleave=function(){bgs.forEach(function(b){b.classList.remove('on')})};box.appendChild(a)});
</script>
</body>
</html>
